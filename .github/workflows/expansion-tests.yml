name: Expansion tests

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the reader app and check the committed copy is current
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff --exit-code -- ../assets/reader-app.html || (echo "assets/reader-app.html is stale: run npm run build in web/ and commit it" && exit 1)
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
      - name: Set up ChromeDriver
        uses: nanasess/setup-chromedriver@v2
      - name: Install browser test dependency
        run: python -m pip install --disable-pip-version-check selenium
      - name: Browser versions
        run: |
          google-chrome --version || chrome --version || chromium --version
          chromedriver --version
      - name: Compile Python
        run: python -m compileall -q scripts
      - name: Audit code health
        env:
          PYTHONPATH: scripts
        run: python scripts/audit_code_health.py --root scripts --strict --json code-health.json
      - name: Run repository and final-delivery tests
        env:
          PYTHONPATH: scripts
          REQUIRE_BROWSER_TESTS: '1'
        run: python -m unittest discover -s scripts -p 'test_*.py'
